version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    ports:
      - '5000:5000'
    volumes:
      - ./backend:/app
      - /app/node_modules
    environment:
      - PORT=5000
      - NODE_ENV=development
      # Puedes poner aquí la URI de conexión de pruebas si la tienes, o crear un archivo .env en local
      - MONGO_URI=${MONGO_URI:-mongodb+srv://...} 
      - JWT_SECRET=super_secreto_desarrollo
      - JWT_EXPIRE=7d
      - FRONTEND_URL=http://localhost:5173

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - '5173:5173'
    volumes:
      - .:/app
      - /app/node_modules
      - /app/backend # Ignoramos la carpeta backend en el watch del frontend
    environment:
      - VITE_API_URL=http://localhost:5000
    depends_on:
      - backend
